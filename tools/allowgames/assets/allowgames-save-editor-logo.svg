<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="740" viewBox="60 140 1480 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14233f"/><stop offset="1" stop-color="#070d1c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ff4a"/><stop offset="1" stop-color="#38c90e"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d6e8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/><stop offset="1" stop-color="#1a6dff"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8cff"/><stop offset="1" stop-color="#123c9c"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ff7a"/><stop offset=".5" stop-color="#2fd35a"/><stop offset="1" stop-color="#0b7a33"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <!-- badge -->
  <path d="M150 170 L1450 170 Q1500 170 1500 220 L1500 640 Q1500 690 1450 690 L1150 690 L1100 760 L500 760 L450 690 L150 690 Q100 690 100 640 L100 220 Q100 170 150 170 Z"
        fill="url(#bg)" stroke="#2ee6ff" stroke-width="8" filter="url(#glow)"/>
  <path d="M150 190 L1450 190 Q1480 190 1480 220 L1480 640 Q1480 670 1450 670 L1140 670 L1090 740 L510 740 L460 670 L150 670 Q120 670 120 640 L120 220 Q120 190 150 190 Z"
        fill="none" stroke="#2ee6ff" stroke-opacity=".25" stroke-width="3"/>

  <!-- editor panel (left) -->
  <g transform="translate(160 235) rotate(-4)" filter="url(#shadow)">
    <rect width="330" height="300" rx="18" fill="#0d1628" stroke="#2ee6ff" stroke-width="4"/>
    <rect x="0" y="0" width="330" height="52" rx="18" fill="#17284a"/>
    <rect x="0" y="34" width="330" height="18" fill="#17284a"/>
    <g transform="translate(20 12)"><rect width="28" height="28" rx="4" fill="#fff"/><rect x="6" y="2" width="16" height="9" fill="#17284a"/><rect x="5" y="16" width="18" height="10" rx="2" fill="#17284a"/></g>
    <text x="62" y="36" font-family="Inter" font-weight="800" font-size="24" fill="#fff">Save Editor</text>
    <g font-family="Inter" font-weight="700" font-size="21" fill="#e8f0ff">
      <path d="M32 88 c-8-10 -22-2 -14 8 l14 12 l14-12 c8-10 -6-18 -14-8z" fill="#ff3b4e"/>
      <text x="62" y="102">Corazones</text><rect x="220" y="78" width="90" height="32" rx="6" fill="#1b2b4b"/><text x="236" y="102">20</text>
      <path d="M32 128 l11 8 v16 l-11 8 l-11-8 v-16z" fill="url(#gem)"/>
      <text x="62" y="152">Rupias</text><rect x="220" y="128" width="90" height="32" rx="6" fill="#1b2b4b"/><text x="236" y="152">999</text>
      <rect x="22" y="182" width="20" height="20" rx="4" fill="#ffc83a"/>
      <text x="62" y="200">Objetos</text><rect x="220" y="176" width="90" height="32" rx="6" fill="#1b2b4b"/><text x="236" y="200">Todo</text>
      <text x="22" y="248" font-size="24" fill="#5fd0ff">♪</text>
      <text x="62" y="248">Canciones</text><rect x="220" y="224" width="90" height="32" rx="6" fill="#1b2b4b"/><text x="236" y="248">13</text>
    </g>
    <rect x="70" y="268" width="190" height="22" rx="11" fill="#38c90e"/>
    <text x="165" y="285" text-anchor="middle" font-family="Inter" font-weight="800" font-size="15" fill="#fff">✓ BACKUP + GUARDAR</text>
  </g>

  <!-- big save disk (center) -->
  <g transform="translate(680 205)" filter="url(#shadow)">
    <path d="M0 24 Q0 0 24 0 L196 0 L240 44 L240 216 Q240 240 216 240 L24 240 Q0 240 0 216 Z" fill="url(#disk)" stroke="#bfe9ff" stroke-width="6"/>
    <rect x="52" y="6" width="120" height="70" rx="6" fill="#d8ecff"/>
    <rect x="134" y="16" width="24" height="50" rx="4" fill="#123c9c"/>
    <rect x="34" y="118" width="172" height="110" rx="10" fill="#f4f8ff"/>
    <!-- heart + gem on the label -->
    <path d="M92 156 c-14-18 -40-4 -26 14 l26 22 l26-22 c14-18 -12-32 -26-14z" fill="#ff3b4e"/>
    <path d="M156 136 l20 14 v30 l-20 14 l-20-14 v-30z" fill="url(#gem)" stroke="#0b7a33" stroke-width="3"/>
  </g>

  <!-- PORT PC badge (right) -->
  <g transform="translate(1180 230) rotate(5)" filter="url(#shadow)">
    <rect width="250" height="230" rx="20" fill="#0d1628" stroke="#2ee6ff" stroke-width="4"/>
    <text x="125" y="70" text-anchor="middle" font-family="Inter" font-style="italic" font-weight="900" font-size="54" fill="#fff">PORT</text>
    <text x="125" y="132" text-anchor="middle" font-family="Inter" font-style="italic" font-weight="900" font-size="64" fill="#2ee6ff">PC</text>
    <!-- monitor -->
    <rect x="85" y="150" width="80" height="50" rx="6" fill="none" stroke="#fff" stroke-width="6"/>
    <rect x="115" y="200" width="20" height="10" fill="#fff"/><rect x="100" y="210" width="50" height="6" rx="3" fill="#fff"/>
  </g>

  <!-- SAVE EDITOR -->
  <g font-family="Inter" font-style="italic" font-weight="900" font-size="150" text-anchor="middle" filter="url(#shadow)">
    <text x="800" y="655" stroke="#050a14" stroke-width="26" stroke-linejoin="round" fill="#050a14">SAVE<tspan dx="40">EDITOR</tspan></text>
    <text x="800" y="655"><tspan fill="url(#white)">SAVE</tspan><tspan dx="40" fill="url(#green)">EDITOR</tspan></text>
  </g>

  <!-- ALLOW GAMES banner -->
  <g filter="url(#shadow)">
    <path d="M380 680 L1220 680 L1190 800 L410 800 Z" fill="#0a1226" stroke="#1a6dff" stroke-width="7"/>
    <g transform="translate(420 708)">
      <path d="M12 8 Q30 0 48 6 L68 6 Q86 0 104 8 Q120 34 112 58 Q104 70 92 60 L80 48 L36 48 L24 60 Q12 70 4 58 Q-4 34 12 8 Z" fill="#fff"/>
      <rect x="22" y="22" width="22" height="7" rx="2" fill="#0a1226"/><rect x="29.5" y="14.5" width="7" height="22" rx="2" fill="#0a1226"/>
      <circle cx="84" cy="20" r="5" fill="#0a1226"/><circle cx="96" cy="31" r="5" fill="#0a1226"/>
    </g>
    <g font-family="Inter" font-style="italic" font-weight="900" font-size="78">
      <text x="845" y="770" text-anchor="end" fill="url(#white)" stroke="#050a14" stroke-width="3">ALLOW</text>
      <text x="870" y="770" fill="url(#blue)" stroke="#050a14" stroke-width="3">GAMES</text>
    </g>
  </g>

  <text x="800" y="850" text-anchor="middle" font-family="Inter" font-weight="700" font-size="28" fill="#9fb6d8" letter-spacing="4">PARA HOOKSHOT · ALLOW GAMES EDITION</text>
</svg>
