# (Allow Games) The edition's release, the way upstream makes its own since its installer (.github/workflows/windows-builder.yml):
# this repository's HookshotBuilder (its updater asks this fork's releases), its setup (HookshotBuilder.exe) and the list it reads
# (hookshot-setup.txt), with the parts that changed uploaded to this fork's builder-parts release and the others (Python, emsdk,
# CPM, wgpu-native, llvm-mingw) taken from upstream's as they are. Also the whole builder in one zip (HookshotBuilder.zip), for
# the readme's "extract and run" and for the updater of AG BETA v1.x builders, which download a zip. No game data anywhere.
# On an AG-* tag, or by hand with a tag name. Release notes: .github/allowgames/<tag>.md
name: Allow Games release
on:
  push:
    tags: ['AG-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (AG-...)
        required: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${TAG#AG-BETA-v}"; V="${V#AG-v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "tag $TAG, version $V"
      - name: llvm-mingw
        run: echo "LLVM_MINGW=$(python -I scripts/release_parts.py llvm-mingw "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"
      # (the newest release's list with Python, emsdk, CPM and wgpu-native parts: this fork's once it has one, else upstream's)
      - name: The latest release's setup list
        run: |
          python -I scripts/release_parts.py previous "$RUNNER_TEMP/previous-setup.txt" \
            --repo "$GITHUB_REPOSITORY" --repo NotRexed/Hookshot --skip-tag "$TAG"
          cat "$RUNNER_TEMP/previous-setup.txt"
      - name: Play profile
        run: python -I scripts/release_parts.py profile "$RUNNER_TEMP/previous-setup.txt" work
      - name: HookshotBuilder-Setup.exe
        working-directory: builder/setup
        run: |
          "$LLVM_MINGW/bin/x86_64-w64-mingw32-windres" setup.rc -O coff -o "$RUNNER_TEMP/setup_rc.o"
          "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" -O2 -mwindows -municode setup.c "$RUNNER_TEMP/setup_rc.o" \
            -lwinhttp -lbcrypt -lcomctl32 -lshell32 -lole32 -o "$RUNNER_TEMP/HookshotBuilder-Setup.exe"
      - name: Hookshot Builder
        run: >-
          dotnet publish builder/HookshotBuilder/HookshotBuilder.csproj --configuration Release
          -p:Version="$VERSION" -p:NuGetAudit=false --output "$RUNNER_TEMP/publish"
      - name: Package folder, with the Allow Games Save Editor beside the builder
        run: |
          P="$RUNNER_TEMP/package"
          python -I scripts/release_parts.py package "$P" --publish "$RUNNER_TEMP/publish" \
            --setup "$RUNNER_TEMP/HookshotBuilder-Setup.exe" --list "$RUNNER_TEMP/previous-setup.txt"
          cp readme.md "$P/tools/"
          E="$P/AllowGames-SaveEditor"
          mkdir -p "$E" && cp -a tools/allowgames/. "$E/"
          # (its launcher with the Allow Games icon: .NET Framework's csc, which every Windows 10/11 has)
          MSYS_NO_PATHCONV=1 /c/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe -nologo -optimize -target:exe \
            "-out:$(cygpath -w "$E/AllowGames-SaveEditor.exe")" '-win32icon:tools\allowgames\assets\icon.ico' \
            'tools\allowgames\launcher\Launcher.cs'
          test -f "$E/AllowGames-SaveEditor.exe"
      - name: Setup parts
        run: |
          python -I scripts/make_setup_parts.py "$RUNNER_TEMP/package" "$TAG" dist \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download/builder-parts" --reuse "$RUNNER_TEMP/previous-setup.txt"
          cp "$RUNNER_TEMP/HookshotBuilder-Setup.exe" dist/HookshotBuilder.exe
          cat dist/hookshot-setup.txt
          ls -l dist
      - name: The whole builder in one zip
        run: python -I scripts/allowgames_full_zip.py dist HookshotBuilder.zip
      - name: New parts to builder-parts
        run: |
          if ! gh release view builder-parts >/dev/null 2>&1; then
            gh release create builder-parts --prerelease --latest=false --target "$GITHUB_SHA" --title builder-parts \
              --notes "The parts HookshotBuilder.exe (the setup) downloads, named by each release's hookshot-setup.txt."
          fi
          have=$(gh release view builder-parts --json assets --jq '.assets[].name')
          for f in dist/HookshotBuilder-*.zip; do
            if grep -qxF "$(basename "$f")" <<<"$have"; then
              echo "$(basename "$f"): already there"
            else
              gh release upload builder-parts "$f"
            fi
          done
      - name: Release
        run: |
          NOTES=".github/allowgames/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          FILES=(HookshotBuilder.zip dist/HookshotBuilder.exe dist/hookshot-setup.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            # (the Linux AppImage workflow may have made it first, with GitHub's generated notes: the edition's title and notes)
            gh release edit "$TAG" --title "Allow Games Edition — ${TAG#AG-}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "Allow Games Edition — ${TAG#AG-}" \
              --notes-file "$NOTES" --latest
          fi
