# (Allow Games) The edition's HookshotBuilder.zip: this repository's own HookshotBuilder.exe (built here, so its updater asks
# this fork's releases) and upstream's released tools (Python, llvm-mingw, emsdk and prebuilt helpers, none of it game data),
# with this repository's sources laid over the tools folder. Published as the tag's release.
# Run it by hand with a tag name (AG-...). Release notes: .github/allowgames/<tag>.md
name: Allow Games release
on:
  push:
    tags: ['AG-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (AG-...)
        required: true
permissions:
  contents: write
env:
  UPSTREAM_TOOLS_TAG: no-visual-studio   # (the last upstream release shipped as one zip: its tools folder is reused)
jobs:
  zip:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tag
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Upstream tools
        run: |
          curl -fsSL --retry 5 -o upstream.zip "https://github.com/NotRexed/Hookshot/releases/download/${UPSTREAM_TOOLS_TAG}/HookshotBuilder.zip"
          mkdir up && cd up && unzip -q ../upstream.zip && ls
      - name: This edition's HookshotBuilder.exe
        run: |
          V="${TAG#AG-BETA-v}"; V="${V#AG-v}"
          dotnet publish builder/HookshotBuilder/HookshotBuilder.csproj -c Release -o pub -p:Version="${V}.0" 2>&1 | tail -5
          B=up/HookshotBuilder
          # (the app's own files replaced; the tools folder stays)
          find "$B" -maxdepth 1 -type f -delete
          cp -a pub/. "$B/"
          ls "$B" | head
      - name: This edition's sources over the tools
        run: |
          T=up/HookshotBuilder/tools
          for d in host gpu nx2 scripts third_party builder; do [ -d "$d" ] && mkdir -p "$T/$d" && cp -a "$d/." "$T/$d/"; done
          [ -d work ] && cp -a work/. "$T/work/" || true
          cp readme.md LICENSE "$T/"
          # (the Allow Games Save Editor, beside HookshotBuilder.exe: drag a progress.sav onto its .bat)
          mkdir -p up/HookshotBuilder/AllowGames-SaveEditor && cp -a tools/allowgames/. up/HookshotBuilder/AllowGames-SaveEditor/
          echo "$TAG" > "$T/version.txt"
          # (never game files: stop if anything that looks like one got in)
          if find up -iname '*.nup' -o -iname '*.keys' -o -iname 'hookshot.exe' -o -iname 'image.bin' | grep -q .; then
            echo "game files found"; exit 1; fi
          (cd up && 7z a -tzip -mx=7 ../HookshotBuilder.zip HookshotBuilder > /dev/null)
          ls -la HookshotBuilder.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/allowgames/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" HookshotBuilder.zip --clobber
          else
            gh release create "$TAG" HookshotBuilder.zip --target "$GITHUB_SHA" --title "Allow Games Edition — ${TAG#AG-}" \
              --notes-file "$NOTES" --latest
          fi
